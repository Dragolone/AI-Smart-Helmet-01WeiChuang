name: CI

# 私有仓库按分钟计费（免费额度 2,000 分钟/月，2026-10 半个月就用完），下面四处都是为了省分钟：
# ① 只动文档 / 计划 / 设计稿的提交不跑——这些路径没有被代码或测试读取（测试只往 docs/testing 写证据）
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "plan/**"
      - "design/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "plan/**"
      - "design/**"

# ② 同一个 PR 连续推送时取消上一次还没跑完的；main 上每次 push 用 run_id 各占一组，互不取消也不排队
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    # ④ PR squash 合进 main 的那次 push 不再跑：同一份代码在 PR 上刚跑过，而 10 月前 19 天 main 上的 195 次 push 里有 158 次是它。
    #    判据是 committer：GitHub 代为合并的提交 committer 固定为 noreply@github.com；本人直推 main 的提交 committer 是自己，照跑。
    if: github.event_name != 'push' || github.event.head_commit.committer.email != 'noreply@github.com'
    runs-on: ubuntu-latest
    # ③ 正常一次约 10–15 分钟；卡死时默认要等 360 分钟才被杀，这里提前止损
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helmet
          POSTGRES_PASSWORD: helmet_ci
          POSTGRES_DB: helmet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helmet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Test
        run: npm test --workspaces --if-present

      # CLAUDE.md Testing Rules：migration 必须能在空库从头跑通
      - name: Migrations on empty DB
        working-directory: backend
        env:
          DATABASE_URL: postgresql://helmet:helmet_ci@localhost:5432/helmet_ci
        run: npx prisma migrate deploy

      # Build 先于 e2e：audit-shutdown 用例起真实进程 node dist/main.js 验证 SIGTERM 排空
      - name: Build
        run: npm run build --workspace backend --if-present && npm run build --workspace admin --if-present

      # 关键 API 集成测试（注册/登录/刷新全链路，跑在上一步刚建好的库上）
      - name: Backend e2e
        working-directory: backend
        env:
          DATABASE_URL: postgresql://helmet:helmet_ci@localhost:5432/helmet_ci
          JWT_SECRET: ci_only_test_secret
          ADMIN_JWT_SECRET: ci_only_admin_secret
          EMQX_INTERNAL_TOKEN: ci_only_internal_token
        run: npm run test:e2e
