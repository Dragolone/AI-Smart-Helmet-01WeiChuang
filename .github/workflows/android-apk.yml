# 手动触发：在 GitHub 上打一个安卓 APK（给硬件联调 / 内测装机），产物挂在 Actions 的 Artifacts 里。
# 为什么放 CI：本机 node_modules 被 iCloud 挪成占位时 gradle 起不来（DEVELOPMENT.md「iCloud」一节）；
# 另外任何人（A/B 线）都能不装 Android 工具链拿到同一份包。
# 签名：仓库配了 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
# 四个 secret 时用正式证书；没配则退回 Expo 模板的 debug.keystore（只能测试装机，不能上架，DEVELOPMENT.md 有说明）。
name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "打进包里的后端地址（EXPO_PUBLIC_API_URL）"
        required: true
        default: "https://dev-api.01weichuang.com/api/v1"

jobs:
  apk:
    runs-on: ubuntu-latest
    # 首次冷构建（无缓存）实测超过 45 分钟：Hermes + 十几个原生模块在 4 核 runner 上很慢
    timeout-minutes: 120
    env:
      # secrets 不能直接用在 step 的 if 里，先在 job 级折成布尔字符串
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 依赖与构建缓存：第二次起可省下大半时间
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # ubuntu-latest 只剩约 14 GB 可用盘：Gradle 冷构建 + libVLC + Skia + NDK 产物会把盘撑满（10-15 实测 Assemble 中途
      # 「No space left on device」）。先清掉用不到的预装工具链（.NET / Haskell / CodeQL / Swift / 旧 NDK，保留 NDK 27）
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/lib/android/sdk/ndk/2[0-6]*
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install
        run: npm ci

      - name: Build shared types
        run: npm run build -w @helmet/shared

      # CNG：android/ 不进 Git，每次从 app.json + 插件重新生成
      - name: Prebuild (android)
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Restore release keystore (optional)
        id: keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      # 步骤级限时：超时时 job 正常收尾，日志与下面的 gradle.log 才保得住（job 级超时会把日志一起丢掉，09-23 两次实测）
      - name: Assemble release
        working-directory: app/android
        timeout-minutes: 80
        env:
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url }}
          EXPO_PUBLIC_AMAP_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_AMAP_ANDROID_KEY }}
          EXPO_PUBLIC_AMAP_JS_KEY: ${{ secrets.EXPO_PUBLIC_AMAP_JS_KEY }}
          EXPO_PUBLIC_AMAP_JS_SECURITY_CODE: ${{ secrets.EXPO_PUBLIC_AMAP_JS_SECURITY_CODE }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 只编 arm64-v8a：真机基本都是 arm64，每多一种 ABI 就多编一遍 C++（新架构 + reanimated 等，冷构建最慢的部分）；
          # 不带这个 -P 时按 app.json 的 buildArchs 编 arm64-v8a + armeabi-v7a 两种
          args=(assembleRelease --console=plain -PreactNativeArchitectures=arm64-v8a)
          if [ -n "$KEYSTORE_PATH" ]; then
            echo "使用正式证书签名"
            args+=(-Pandroid.injected.signing.store.file="$KEYSTORE_PATH"
                   -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
                   -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
                   -Pandroid.injected.signing.key.password="$KEY_PASSWORD")
          else
            echo "未配置签名 secret：用 debug.keystore（仅测试装机）"
          fi
          ./gradlew "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ github.run_id }}
          path: ${{ runner.temp }}/gradle.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Name the artifact
        id: meta
        run: |
          short=$(git rev-parse --short HEAD)
          echo "name=helmet-app-${short}" >> "$GITHUB_OUTPUT"
          cp app/android/app/build/outputs/apk/release/app-release.apk "helmet-app-${short}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: helmet-app-*.apk
          retention-days: 30
