buffers { size_kb: 131072 fill_policy: RING_BUFFER }
data_sources {
  config {
    name: "android.heapprofd"
    heapprofd_config {
      sampling_interval_bytes: 2048
      process_cmdline: "com.lingyiweichuang.app"
      shmem_size_bytes: 16777216
      block_client: true
      continuous_dump_config { dump_phase_ms: 30000 dump_interval_ms: 60000 }
    }
  }
}
duration_ms: 480000
write_into_file: true
file_write_period_ms: 30000
flush_period_ms: 30000
