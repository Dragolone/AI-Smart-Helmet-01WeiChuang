# 本地开发基础设施：PostgreSQL + EMQX
# 启动：docker compose up -d    停止：docker compose down
# 凭证仅用于本地开发环境；development/production 环境使用独立的强凭证（不入库）。
services:
  postgres:
    image: postgres:16
    container_name: helmet-postgres
    ports:
      # 只绑本机回环：避免同一局域网内其他设备直连开发库
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: helmet
      POSTGRES_PASSWORD: helmet_local_dev
      POSTGRES_DB: helmet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helmet"]
      interval: 5s
      timeout: 3s
      retries: 10

  emqx:
    image: emqx:5
    container_name: helmet-emqx
    ports:
      # 只绑本机回环（局域网隔离）；需要真机/局域网设备连入联调时再临时放开并知会对方
      - "127.0.0.1:1883:1883"   # MQTT（本地明文；云端环境必须 TLS 8883）
      - "127.0.0.1:18083:18083" # EMQX Dashboard（本地默认账号 admin/public）
    volumes:
      - emqx_data:/opt/emqx/data
      # 设备认证 + Topic ACL（追加在官方默认配置之后，见 emqx/emqx.conf 尾部注释）
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/acl-fallback.conf:/opt/emqx/etc/acl-fallback.conf:ro
    extra_hosts:
      # Linux 服务器上也能解析宿主机（Docker Desktop 自带，此行为部署兼容）
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  emqx_data:
