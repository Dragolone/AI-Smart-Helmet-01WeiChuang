# development/production 环境编排（CLAUDE.md 环境规划：Docker Compose 起 后端 + EMQX + PG）
# 使用前提：deploy/.env 已从 .env.example 复制填好；sh render-config.sh 已生成 generated/emqx.conf
# 启动：cd deploy && docker compose -f docker-compose.prod.yml up -d --build
# 完整步骤与验收清单：docs/DEPLOYMENT.md

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # 不映射宿主端口：数据库仅容器网络内可达，杜绝公网扫库
    environment:
      POSTGRES_USER: helmet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env 未配置 POSTGRES_PASSWORD}
      POSTGRES_DB: helmet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helmet"]
      interval: 5s
      timeout: 3s
      retries: 10

  emqx:
    image: emqx:5
    restart: unless-stopped
    ports:
      # MQTT 明文：TLS 待硬件确认（DEVICE_PROTOCOL §3 ⚠️）；公网暴露面靠云防火墙限源 IP 收紧
      - "1883:1883"
      # Dashboard 仅绑本机：运维经 SSH 隧道访问（ssh -L 18083:localhost:18083 <server>）
      - "127.0.0.1:18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - ./generated/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    environment:
      # 覆盖模板里的占位 cookie（Erlang 分布式协议凭证，单节点也别用默认值）
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?deploy/.env 未配置 EMQX_NODE_COOKIE}
      # Dashboard 首登密码（默认 admin/public 必须换掉；仅本机可达是第二道防线不是理由）
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?deploy/.env 未配置 EMQX_DASHBOARD_PASSWORD}

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # 不映射宿主端口：REST/WS 一律经 gateway 443 进来；EMQX 回调走容器网络 backend:3000
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_started
    # SIGTERM 后先 /health→503 排空 SHUTDOWN_DRAIN_MS 再关闭（默认 3s）；宽限期要比它长，否则 compose 会直接 SIGKILL
    stop_grace_period: 15s
    environment:
      DATABASE_URL: postgresql://helmet:${POSTGRES_PASSWORD}@postgres:5432/helmet
      # backend 只经 gateway 一跳到达：信任第一跳的 X-Forwarded-For，req.ip 才是真实客户端（限频按此计）
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-}
      SMS_SEND_TIMEOUT_MS: ${SMS_SEND_TIMEOUT_MS:-}
      MQTT_URL: mqtt://emqx:1883
      MQTT_BACKEND_CLIENT_ID: backend_ingest
      MQTT_BACKEND_USERNAME: ${MQTT_BACKEND_USERNAME:-backend_ingest}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?deploy/.env 未配置 MQTT_BACKEND_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?deploy/.env 未配置 JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?deploy/.env 未配置 ADMIN_JWT_SECRET}
      EMQX_INTERNAL_TOKEN: ${EMQX_INTERNAL_TOKEN:?deploy/.env 未配置 EMQX_INTERNAL_TOKEN}
      INGEST_WEBHOOK_API_KEY: ${INGEST_WEBHOOK_API_KEY:-}
      TRTC_SDK_APP_ID: ${TRTC_SDK_APP_ID:-}
      TRTC_SECRET_KEY: ${TRTC_SECRET_KEY:-}
      # 短信通道（六项齐全走腾讯云，否则 Console Mock）
      TENCENT_SMS_SECRET_ID: ${TENCENT_SMS_SECRET_ID:-}
      TENCENT_SMS_SECRET_KEY: ${TENCENT_SMS_SECRET_KEY:-}
      TENCENT_SMS_SDK_APP_ID: ${TENCENT_SMS_SDK_APP_ID:-}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME:-}
      TENCENT_SMS_TEMPLATE_VERIFY_CODE: ${TENCENT_SMS_TEMPLATE_VERIFY_CODE:-}
      TENCENT_SMS_TEMPLATE_SOS_ALERT: ${TENCENT_SMS_TEMPLATE_SOS_ALERT:-}
      TENCENT_SMS_REGION: ${TENCENT_SMS_REGION:-}
      # 对象存储（密钥与桶名齐全走腾讯云 COS，否则 Mock）
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID:-}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY:-}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION:-}
      SMS_CODE_TTL_SECONDS: ${SMS_CODE_TTL_SECONDS:-}
      SMS_CODE_RESEND_INTERVAL_SECONDS: ${SMS_CODE_RESEND_INTERVAL_SECONDS:-}
      SMS_CODE_DAILY_LIMIT: ${SMS_CODE_DAILY_LIMIT:-}
      SMS_CODE_MAX_ATTEMPTS: ${SMS_CODE_MAX_ATTEMPTS:-}
      # 可调业务参数：留空即用代码内默认值（见 deploy/.env.example 末段）。
      # 必须在此显式透传——否则运维在 deploy/.env 里改了也不会进容器，属于"看似可配、实际改不了"。
      SOS_COUNTDOWN_SECONDS: ${SOS_COUNTDOWN_SECONDS:-}
      SOS_SCAN_INTERVAL_MS: ${SOS_SCAN_INTERVAL_MS:-}
      SOS_NOTIFY_MAX_ATTEMPTS: ${SOS_NOTIFY_MAX_ATTEMPTS:-}
      COMMAND_ACK_TIMEOUT_SECONDS: ${COMMAND_ACK_TIMEOUT_SECONDS:-}
      COMMAND_SCAN_INTERVAL_MS: ${COMMAND_SCAN_INTERVAL_MS:-}
      MEDIA_URL_TTL_SECONDS: ${MEDIA_URL_TTL_SECONDS:-}
      TRTC_SIG_EXPIRE_SECONDS: ${TRTC_SIG_EXPIRE_SECONDS:-}
      VOICE_CHANNEL_MEMBER_LIMIT: ${VOICE_CHANNEL_MEMBER_LIMIT:-}

  # 演示常驻 Mock 头盔（CLAUDE.md「演示环境常驻 Mock 设备跑剧本，保证随时可 Demo」）
  # 与外部真机/Mock 走完全相同的 MQTT + 设备认证 + Topic ACL，仅网络路径为容器内网 emqx:1883。
  # 归属 profile demo：deploy/.env 里 COMPOSE_PROFILES=demo 打开即随日常命令一起起停；
  # 凭证来自 provision:device（§3），未开通前不要打开 profile。
  mock:
    build:
      context: ..
      dockerfile: mock-device/Dockerfile
    restart: unless-stopped
    profiles: ["demo"]
    depends_on:
      backend:
        condition: service_started
    environment:
      MQTT_URL: mqtt://emqx:1883
      DEVICE_ID: ${MOCK_DEVICE_ID:-}
      DEVICE_SECRET: ${MOCK_DEVICE_SECRET:-}
      # 剧本：留空=正常骑行；ski / fall / sos / risk 见 docs/DEVELOPMENT.md
      SCENARIO: ${MOCK_SCENARIO:-}
      # 位置上报间隔（ms）：常驻演示建议 10000，减缓 location_points 增长（本地默认 5000）
      LOCATION_INTERVAL_MS: ${MOCK_LOCATION_INTERVAL_MS:-10000}
      MOCK_CMD_RESULT: ${MOCK_CMD_RESULT:-success}

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    ports:
      - "80:80"   # ACME HTTP 验证 + 自动跳转 https
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 证书与 ACME 账号——删卷=重新签发，触发 Let's Encrypt 频率限制
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN:?deploy/.env 未配置 API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?deploy/.env 未配置 ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?deploy/.env 未配置 ACME_EMAIL}

volumes:
  postgres_data:
  emqx_data:
  caddy_data:
  caddy_config:
