%% EMQX 本地 Topic ACL：只在后端授权回调不可达时生效（authorization.sources 第二项，云端与本地共用本文件）。
%%
%% 为什么要它：授权回调指向后端。后端重启那十几秒，加上 EMQX 把拒绝结果缓存 1 分钟，设备发的消息全被拒；
%% 而 MQTT 3.1.1 的 PUBACK 不带结果码，设备以为送达了——QoS 1 的摔倒事件就这样静默丢掉
%% （2026-10-17 本机 EMQX 5.8.8 复现，云端重启后同样的拒绝日志）。
%%
%% 规则与 backend/src/emqx/emqx-hook.service.ts 的 authorize 一致（emqx-acl-fallback.spec 对比两边）：
%% 设备只能发布自己的 helmet/{deviceId}/{status,location,event,cmd_ack}，订阅自己的 helmet/{deviceId}/cmd。
%% username 先过正则再代入 topic：含 + # / 的用户名不能把规则变成通配。
%% 后端可达时它的 allow / deny 就是最终结果，走不到这里；连接认证仍只认后端（后端挂了新连接一律拒，fail-closed 不变）。
%%
%% 改完要重建 EMQX 容器才生效（单文件挂载绑的是旧文件）：docker compose up -d --force-recreate emqx

{allow, {username, {re, "^[A-Za-z0-9_-]{1,64}$"}}, publish, ["helmet/${username}/status", "helmet/${username}/location", "helmet/${username}/event", "helmet/${username}/cmd_ack"]}.
{allow, {username, {re, "^[A-Za-z0-9_-]{1,64}$"}}, subscribe, ["helmet/${username}/cmd"]}.
