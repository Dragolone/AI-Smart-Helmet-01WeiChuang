## Place read-only configurations in this file.
## To define configurations that can later be overridden through UI/API/CLI, add them to `etc/base.hocon`.
##
## Config precedence order:
##   etc/base.hocon < cluster.hocon < emqx.conf < environment variables
##
## See https://www.emqx.io/docs/en/latest/configuration/configuration.html for more information.
## Configuration full example can be found in etc/examples

node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
    listeners {
        http.bind = 18083
        # https.bind = 18084
        https {
            ssl_options {
                certfile = "${EMQX_ETC_DIR}/certs/cert.pem"
                keyfile = "${EMQX_ETC_DIR}/certs/key.pem"
            }
        }
    }
}

## ———— 以下为本项目追加：设备认证 + Topic ACL（DEVICE_PROTOCOL §3/§4 落地；ACL 随认证应答下发） ————
## 认证转发后端内部接口校验；?token= 与 backend/.env 的 EMQX_INTERNAL_TOKEN 一致，云端换强随机值。
## enable_pipelining=1：避免连接池复用与后端 keep-alive 空闲关闭的竞态。

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://host.docker.internal:3000/api/v1/internal/emqx/authenticate?token=local_dev_emqx_token"
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
    enable_pipelining = 1
    connect_timeout = "5s"
    request_timeout = "5s"
  }
]

authorization {
  ## 不配任何授权源：设备权限随认证应答的 acl 字段下发（后端 emqx-hook authenticate），服务账号是超级用户。
  ## 不再回调后端 authorize——EMQX 刚启动约 0.1 s 内的连接不经认证就被放进来（错密码也行，2026-10-17 本机 5.8.8 复现），
  ## 按 username 匹配 topic 的回调 / 本地 ACL 会让这种连接冒充任意头盔发假摔倒；随认证下发的 ACL 它拿不到，什么都发不了。
  ## 附带：发布不再依赖后端在线，后端重启不会让已连着的设备被拒（原先拒绝结果还缓存 1 分钟）。
  no_match = deny
  ## 被拒就断开：启动窗口里混进来的连接（含我们自己重连得太快的设备）一发布就被踢，重连时走正常认证拿到 ACL；
  ## QoS 1 消息没拿到 PUBACK，设备会重发。默认的 ignore 会照回 PUBACK（MQTT 3.1.1 不带结果码）——消息静默丢掉
  deny_action = disconnect
  sources = []
}
