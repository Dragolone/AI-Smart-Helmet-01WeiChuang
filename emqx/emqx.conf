## Place read-only configurations in this file.
## To define configurations that can later be overridden through UI/API/CLI, add them to `etc/base.hocon`.
##
## Config precedence order:
##   etc/base.hocon < cluster.hocon < emqx.conf < environment variables
##
## See https://www.emqx.io/docs/en/latest/configuration/configuration.html for more information.
## Configuration full example can be found in etc/examples

node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
    listeners {
        http.bind = 18083
        # https.bind = 18084
        https {
            ssl_options {
                certfile = "${EMQX_ETC_DIR}/certs/cert.pem"
                keyfile = "${EMQX_ETC_DIR}/certs/key.pem"
            }
        }
    }
}

## ———— 以下为本项目追加：设备认证 + Topic ACL（DEVICE_PROTOCOL §3/§4 落地） ————
## 全部转发后端内部接口校验；?token= 与 backend/.env 的 EMQX_INTERNAL_TOKEN 一致，云端换强随机值。
## enable_pipelining=1：避免连接池复用与后端 keep-alive 空闲关闭的竞态。

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://host.docker.internal:3000/api/v1/internal/emqx/authenticate?token=local_dev_emqx_token"
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
    enable_pipelining = 1
    connect_timeout = "5s"
    request_timeout = "5s"
  }
]

authorization {
  no_match = deny
  sources = [
    {
      type = http
      method = post
      url = "http://host.docker.internal:3000/api/v1/internal/emqx/authorize?token=local_dev_emqx_token"
      body {
        clientid = "${clientid}"
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
      enable_pipelining = 1
      connect_timeout = "5s"
      request_timeout = "5s"
    }
    ## 后端回调不可达时的本地兜底：规则同后端 authorize，原因见 emqx/acl-fallback.conf 文件头
    {
      type = file
      path = "/opt/emqx/etc/acl-fallback.conf"
    }
  ]
}
